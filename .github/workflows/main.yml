name: Profile Readme

permissions:
  contents: write

on:
  schedule:
    # After WakaTime public leaderboard refresh (often ~08:xx UTC)
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update WakaTime badges
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python3 .github/scripts/update_wakatime_rank.py

      - name: Commit WakaTime badges
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update WakaTime badges"
          file_pattern: README.md

      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_TITLE: true
          TIME_RANGE: "all_time"
          SHOW_TIME: true
          SHOW_MASKED_TIME: true
          LANG_COUNT: 7

      - name: Update Duolingo stats
        uses: akmalsyrf/duolingo-readme@main
        with:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DUOLINGO_USERNAME: ${{ secrets.DUOLINGO_USERNAME }}
          DUOLINGO_JWT: ${{ secrets.DUOLINGO_JWT }}
          SECTION_NAME: duolingo
          LANGS_SECTION_NAME: duolingo_langs
          LAYOUT: two_rows
          LANG_COUNT: 7
